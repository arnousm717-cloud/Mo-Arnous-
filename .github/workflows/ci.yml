name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Merge-blocking per docs/10-CLAUDE.md §8: a known high/critical
      # dependency vulnerability fails the build, not a follow-up ticket
      # (M1.8, docs/08-Security.md §10). Dependabot (.github/dependabot.yml)
      # separately opens update PRs on a schedule; this step is what
      # actually enforces the gate on every PR.
      - run: pnpm audit --audit-level=high

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # Starts the same local Supabase CLI stack (Postgres, GoTrue, Mailpit)
      # already used identically in local dev — ubuntu-latest runners have
      # Docker pre-installed, so this needs no new runner configuration.
      # Every test file in this repo defaults DATABASE_URL/the Supabase
      # URL+anon+service-role keys to the CLI's well-known, publicly
      # documented local demo values (never valid against a real project),
      # so this step needs zero GitHub Secrets. `start` applies every
      # pending migration automatically on its very first run against a
      # fresh volume — verified empirically (not assumed) by tearing down
      # the local stack's Docker volume entirely and confirming a clean
      # `start` alone leaves all M1.1-M1.5 migrations applied, which is
      # exactly the state every GitHub Actions runner begins in.
      #
      # Services excluded (-x) are verified unused by the test suite (M1.5
      # CI hardening): no test/application code references Storage,
      # Realtime, Edge Functions, imgproxy, Studio, or PostgREST's
      # supabase-js `.from()` API (ADR-004 — the app only ever queries
      # Postgres directly), and tests connect straight to Postgres on
      # 54322, not through Supavisor. gotrue, mailpit, and kong (the
      # gateway that serves GoTrue on the shared 54321 port every test
      # connects to) are kept — packages/auth's real-session tests and the
      # email-confirmation-callback test genuinely need them. This exact
      # exclusion list was verified against a fully wiped local volume
      # (`docker ps` confirmed only db/auth/kong/mailpit remained running,
      # everything else genuinely stopped) before being written here.
      - run: pnpm --filter @ai-revenue-os/database exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,postgrest

      # Includes packages/database/tests/environment-target.test.ts (M1.9
      # environment-separation guard): a pure, no-network invariant test —
      # it proves the guard's logic (Preview must resolve to the staging
      # project, on both the Auth and Postgres targets, or fail closed), not
      # that any real Vercel Preview deployment is actually configured that
      # way. GitHub Actions has no access to Vercel's real Preview env vars,
      # so it cannot and does not attempt that separate, live check — see
      # docs/13-Technical-Design-Review.md §M1.9 for what is and isn't
      # proven by this step versus the manual live verification already
      # performed against the real Preview deployment.
      - run: pnpm test
